<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

	<body>
	
	<div th:fragment="content(heading, description, projectLink)" class="container-fluid" style="margin-top:150px;">
		<div class="py-5">
			<div class="row py-5">
				<div class="col" >
					<div  class="d-grid gap-5">
						<div>
							<p class="fs-1 text-center ubuntu-bold">
							 	[[${heading}]]
							</p>
						</div>
						<div class="custom-max-width" style="margin: 0 auto;">
							<p class="fs-6 text-center ubuntu-regular">
								[[${description}]]
							</p>	
						</div>
						<div class="d-flex justify-content-center">
							<a th:href="${projectLink}" target="_blank" class="rounded px-5 py-3 btn-custom-blue ubuntu-bold ">PROJECT LINK</a>
						</div>
						<div class="d-flex justify-content-center">
							<i class="fa-solid fa-angles-down fa-bounce fa-2xl" style="color: #B197FC;"></i>
						</div>
					</div>
					
					
				</div>
			</div>
		</div>
	</div>
	</body>
</html>
