/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'org.springframework.boot' version '3.2.0'  // Use your Spring Boot version
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
    id 'java-library'
    id 'maven-publish'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.samsoft.portfolio.PortfolioApplication'
    }
}
repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {
    api libs.org.springframework.boot.spring.boot.starter.web
    api libs.org.springframework.boot.spring.boot.starter.thymeleaf
    api libs.org.webjars.bootstrap
    api libs.org.webjars.jquery
    api libs.org.webjars.webjars.locator.core
    testImplementation libs.org.springframework.boot.spring.boot.starter.test
}

group = 'com.samsoft'
version = '0.0.1-SNAPSHOT'
description = 'portfolio'
java.sourceCompatibility = JavaVersion.VERSION_1_8

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
